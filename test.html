<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Page</title>
</head>
<body>
  <main>
    <h1>Test page</h1>
    <p>This is a test page.</p>
    <p id="javascript-status" aria-live="polite">JavaScript has not run yet.</p>
    <button id="test-button" type="button">Click to test JavaScript</button>
    <p><a href="index.html">Back to the home page</a></p>
  </main>
  <script>
    const status = document.querySelector("#javascript-status");
    const button = document.querySelector("#test-button");
    const storageKey = "public-test-click-count";
    let clickCount = 0;
    let persistentStorageAvailable = true;

    try {
      const savedCount = Number.parseInt(localStorage.getItem(storageKey), 10);
      if (Number.isFinite(savedCount) && savedCount >= 0) {
        clickCount = savedCount;
      }
    } catch {
      persistentStorageAvailable = false;
    }

    function updateStatus() {
      const persistenceMessage = persistentStorageAvailable
        ? "This count is saved in this browser."
        : "Browser storage is unavailable, so this count will reset when the page closes.";
      status.textContent = `JavaScript is running. Button clicked ${clickCount} time${clickCount === 1 ? "" : "s"}. ${persistenceMessage}`;
    }

    updateStatus();
    button.addEventListener("click", () => {
      clickCount += 1;

      if (persistentStorageAvailable) {
        try {
          localStorage.setItem(storageKey, String(clickCount));
        } catch {
          persistentStorageAvailable = false;
        }
      }

      updateStatus();
    });
  </script>
</body>
</html>
